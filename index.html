<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>OrbitaSP</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="images/Sem título - 08 de junho de 2026 às 23.33.45.png" alt="" width="150px">
        </div>

        <div class="nav-links">
            <a href="#consultar">Consultar</a>
            <a href="#saiba-mais">Saiba mais</a>
        </div>
    </nav>

    <main>
        <section class="hero">
        <div class="hero-text">
            <h1>
            Monitore riscos de enchente
            na cidade de São Paulo.
            </h1>

            <p>
            Informe o CEP desejado para consultar o nível estimado de risco
            de enchente e receber recomendações de segurança para a região.
            </p>
        </div>

        <div class="hero-image">
            <img src="images/Sem título - 09 de junho de 2026 às 00.08.10.png" alt="Satélite">
        </div>
        </section>

        <section class="search-section">
        <label>Digite seu CEP</label>

        <input
            type="text"
            placeholder="CEP"
            maxlength="9"
        >

        <button>Consultar</button>
        </section>
    </main>
</body>
</html>
